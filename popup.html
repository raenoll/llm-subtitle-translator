<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Subtitle Translator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>字幕翻译</h1>
      <label class="switch" title="启用翻译">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </header>

    <section class="row">
      <label for="targetLanguage">目标语言</label>
      <select id="targetLanguage">
        <option value="简体中文">简体中文</option>
        <option value="繁體中文">繁體中文</option>
        <option value="English">English</option>
        <option value="日本語">日本語</option>
        <option value="한국어">한국어</option>
        <option value="Español">Español</option>
        <option value="Français">Français</option>
        <option value="Deutsch">Deutsch</option>
        <option value="Português">Português</option>
        <option value="Русский">Русский</option>
      </select>
    </section>

    <section class="row">
      <label for="showOriginal">显示原文</label>
      <label class="switch small">
        <input type="checkbox" id="showOriginal" />
        <span class="slider"></span>
      </label>
    </section>

    <section class="row">
      <label for="provider">后端</label>
      <!-- Keep these labels identical to the ones in options.html. -->
      <select id="provider">
        <option value="gemini">Google Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic Claude</option>
        <option value="google-translate">Google Translate（基础模式）</option>
        <option value="custom">自定义（OpenAI 兼容）</option>
      </select>
    </section>

    <div id="status" class="status"></div>

    <footer>
      <button id="openOptions" class="link">打开完整设置 →</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
